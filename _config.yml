title: EE209 Introduction to Programming and Computer Systems

url: https://computer.kaist.ac.kr
baseurl: /

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-redirect-from

minima_reboot:
  date_format: "%b %-d, %Y"
  date_format_short: "%b %-d"

header_pages:
- precepts.md
- assign.md
- oldexams.md
- policy.md

paginate: 5

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - minima-reboot.gemspec
  - vendor/bundle
  # assignments symbolic links
  - assignments/assignment1
  - assignments/assignment2
  - assignments/assignment3
  - assignments/assignment4
  - assignments/assignment5
  # assignments original files
  - assignments/tokenizer
  - assignments/string
  - assignments/cm
  - assignments/assembly
  - assignments/unixshell
  # misc
  - assignments/ht
  - assignments/mmr_db
  - assignments/rect
  - assignments/wc209

